rules:
  DRUG_BRAND:
    severity: BLOCKING
    words:
      - ozempic
      - wegovy
      - rybelsus
      - mounjaro
      - zepbound
      - saxenda
      - victoza
      - trulicity
      - xenical
      - alli
      - contrave
      - qsymia
      - glycomet
      - glucophage

  DRUG_GENERIC_PROMO:
    severity: WARNING
    words:
      - semaglutide
      - tirzepatide
      - liraglutide
      - dulaglutide

  PROMISE:
    severity: BLOCKING
    regexes:
      - '(?i)\b(?:lose|drop|shed)\s+\d+\s*(?:kg|kilo|kilos|pounds|lbs)\b'
      - '(?i)\bin\s+\d+\s*(?:days|weeks)\b'
      - '(?i)\bguarantee(?:d)?\b'
      - '(?i)\bresults\s+in\b'
      - '(?i)\byou\s+will\s+lose\b'

  HYPE:
    severity: BLOCKING
    words:
      - miracle
      - magic
      - secret
      - hack
      - cure
      - cures
      - melt fat
      - detox
      - burn fat fast
      - revolutionary
      - breakthrough
      - instantly
      - effortless
      - guarantee
      - guaranteed

  FEAR_SHAME:
    severity: BLOCKING
    words:
      - lazy
      - fat people
      - obese people
      - ugly
      - disgusting
      - no excuses
      - you're killing
      - ticking time bomb
      - deadly

  BODY:
    severity: BLOCKING
    words:
      - before and after
      - before/after
      - bikini body
      - beach body
      - transformation
      - flat belly

  ALL_CAPS:
    severity: BLOCKING
    allowlist:
      - GLP-1
      - HbA1c
      - BMI
      - ICMR
      - INDIAB
      - DNA
      - RCT
      - STEP
      - SURMOUNT
      - PCOS
      - WHO
      - ICMR-INDIAB

  LENGTH:
    severity: BLOCKING
    limits:
      carousel_headline: 48
      carousel_body: 160
      static_headline: 48
      static_support: 110
      static_footnote: 90
      reel_onscreen: 40
      reel_voiceover_words: 30
      caption_total: 1800
      hashtags_min: 8
      hashtags_max: 12

  CERTAINTY_ON_EXPLORATORY:
    severity: WARNING
    certainty_words:
      - proves
      - always
      - never
      - will
      - definitely
      - shows that
    qualifier_words:
      - suggests
      - may
      - in this study
      - in the trial
      - one study

  CAUSAL_ON_ASSOCIATION:
    severity: WARNING
    association_words:
      - associated
      - linked
      - correlated
    causal_words:
      - causes
      - leads to
      - makes you
      - because of

  MISSING_SIGNOFF:
    severity: BLOCKING
    required_signoff: "steerclub.com"

  EMOJI_IN_ASSET:
    severity: WARNING

  # Accuracy rules (implemented in PolicyChecker.checkAccuracy; lists documented here)
  CITATION_ON_NONCLAIM:
    severity: BLOCKING
    description: "Citation lines and quote cards render only on kind=claim blocks (and the carousel source slide)."

  CITATION_TEXT_IN_COPY:
    severity: BLOCKING
    description: "Writer copy must not contain author names with 'et al.', '(YYYY)', ', YYYY' or DOI; citations are built from the paper row."

  QUOTE_NOT_CLAIM_COPY:
    severity: BLOCKING
    description: "Reel quote cards must show the approved claim copy (editedCopy if present) verbatim."

  MISSING_QUALIFIER:
    severity: BLOCKING
    description: >
      Every block linked to an EXPLORATORY claim carries a qualifier in every text line
      (slide headline + body, static headline + support, reel onScreen + voiceover, caption paragraph).
      Exemption: the short line (headline / onScreen) may skip it only when it is a non-factual heading
      (no digit, no quantity word, no finding verb) AND the longer line carries the qualifier.
    qualifiers:
      - in this trial
      - in one trial
      - in the trial
      - in one study
      - in this study
      - in the study
      - in this follow-up
      - in one follow-up
      - in the follow-up
      - in this extension
      - suggests
      - suggest
      - suggested
      - may
      - might
      - on average

  ILLUSTRATION_STATES_FACT:
    severity: BLOCKING
    description: >
      Batched Gemini check (temperature 0, cached) on all illustration blocks; 'yes' or a failed check blocks.
      Deterministic backstop: biology, biological, hormone(s), signal(l)ing, metabolism, insulin, blood sugar,
      glucose, cholesterol, blood pressure, calorie deficit(s), "your/the body is|does|wants|needs|fights|tries|burns|stores".

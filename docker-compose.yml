services:
  postgres:
    image: postgres:16
    container_name: steerproof-postgres
    environment:
      POSTGRES_DB: steerproof
      POSTGRES_USER: steer
      POSTGRES_PASSWORD: steer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
